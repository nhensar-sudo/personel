<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personel - Yağcıllı Ortaokulu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #3b82f6;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --accent-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 10px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 900;
      font-size: 2.5rem;
      color: var(--primary-color);
    }

    header p {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: 2px;
      font-weight: 500;
    }

    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #e2e8f0;
      user-select: none;
    }

    .card:active {
      transform: scale(0.98);
      background: #f1f5f9;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--primary-color);
    }

    .card-sub {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
    }

    .card-icon {
      font-size: 1.8rem;
      background: #eff6ff;
      padding: 10px;
      border-radius: 12px;
    }

    .view {
      display: none;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }

    .btn-back {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin-bottom: 16px;
      display: inline-block;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .result-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #f0f9ff;
      border-left: 5px solid var(--secondary-color);
    }

    .warning-box {
      background: #fef2f2;
      border-left-color: var(--accent-red);
      color: #991b1b;
    }

    .duty-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }

    .duty-role {
      font-weight: 700;
      color: var(--primary-color);
      font-size: 0.85rem;
    }

    .duty-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Personel</h1>
      <p>Yağcıllı Ortaokulu</p>
    </header>

    <div id="home-view" class="menu-grid">
      <div class="card" onclick="openPage('teachers-view')">
        <div>
          <div class="card-title">Yağcıllı Ortaokulu Öğretmenleri</div>
          <div class="card-sub">Ders ve Sınıf Konumu Sorgulama</div>
        </div>
        <div class="card-icon">👨‍🏫</div>
      </div>

      <div class="card" onclick="openPage('duty-view')">
        <div>
          <div class="card-title">Yağcıllı Ortaokulu Nöbetçi Öğretmenler</div>
          <div class="card-sub">Günlük Nöbet Çizelgesi</div>
        </div>
        <div class="card-icon">🛡️</div>
      </div>
    </div>

    <div id="teachers-view" class="view">
      <button class="btn-back" onclick="openPage('home-view')">← Ana Sayfa</button>
      <h2 style="font-family: 'Playfair Display', serif; font-style: italic; margin-bottom: 14px; font-size: 1.4rem;">Öğretmen Ders Konumu</h2>
      
      <div class="form-group">
        <label>Öğretmen:</label>
        <select id="teacher-select">
          <option value="Kadir Eser">Kadir Eser (Fen Bilimleri)</option>
          <option value="Yasemin Çakır">Yasemin Çakır (Matematik)</option>
          <option value="Bahar Sarı">Bahar Sarı (İngilizce)</option>
          <option value="Levent Dallık">Levent Dallık (Sosyal Bilgiler)</option>
          <option value="Esma Baydar">Esma Baydar (Sınıf Öğretmeni)</option>
          <option value="Demet Demirtaş">Demet Demirtaş (Görsel Sanatlar)</option>
          <option value="Turan Hoca">Turan Hoca (Türkçe)</option>
          <option value="Ensar Çetinkaya">Ensar Çetinkaya (Müdür Yrd.)</option>
          <option value="Sercan Ersöz">Sercan Ersöz (Okul Müdürü)</option>
          <option value="Asude Genç">Asude Genç (Okul Öncesi)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Gün:</label>
        <select id="day-select">
          <option value="Pazartesi">Pazartesi</option>
          <option value="Salı">Salı</option>
          <option value="Çarşamba">Çarşamba</option>
          <option value="Perşembe">Perşembe</option>
          <option value="Cuma">Cuma</option>
        </select>
      </div>

      <div class="form-group">
        <label>Ders Saati:</label>
        <select id="hour-select">
          <option value="1">1. Ders (09:00 - 09:40)</option>
          <option value="2">2. Ders (09:50 - 10:30)</option>
          <option value="3">3. Ders (10:40 - 11:20)</option>
          <option value="4">4. Ders (11:30 - 12:10)</option>
          <option value="5">5. Ders (12:20/13:00 - 13:00/13:40)</option>
          <option value="6">6. Ders (13:50 - 14:30)</option>
          <option value="7">7. Ders (14:40 - 15:20)</option>
        </select>
      </div>

      <button class="btn-submit" onclick="queryTeacher()">Sorgula</button>
      <div id="teacher-result"></div>
    </div>

    <div id="duty-view" class="view">
      <button class="btn-back" onclick="openPage('home-view')">← Ana Sayfa</button>
      <h2 style="font-family: 'Playfair Display', serif; font-style: italic; margin-bottom: 14px; font-size: 1.4rem;">Nöbetçi Öğretmenler</h2>

      <div class="form-group">
        <label>Tarih Seçin:</label>
        <input type="date" id="duty-date-input">
      </div>

      <button class="btn-submit" onclick="queryDuty()">Nöbetçileri Göster</button>
      <div id="duty-result"></div>
    </div>
  </div>

  <script>
    const lessonNames = {
      "TR": "Türkçe", "MAT": "Matematik", "FEN": "Fen Bilimleri", "SOS": "Sosyal Bilgiler",
      "T.C.": "T.C. İnkılap Tarihi", "YB": "Yabancı Dil", "BEDEN": "Beden Eğitimi", "DİNKÜ": "Din Kültürü",
      "GR": "Görsel Sanatlar", "MZK": "Müzik", "TKTA": "Teknoloji Tasarım", "BLŞ": "Bilişim",
      "REH": "Rehberlik", "SO": "Seçmeli Okuma", "SKVM": "Seç. Kültür ve Medeniyet",
      "SOY": "Seçmeli Oyun", "SSOS": "Seç. Sosyal Sorumluluk", "SP": "Seç. Peygamberimizin Hayatı", "SSP": "Seçmeli Spor"
    };

    const timetable = {
      "Ensar Çetinkaya": { "Pazartesi": { 5: "8/A BEDEN" }, "Salı": { 1: "6/A BEDEN" }, "Çarşamba": { 6: "5/A BEDEN", 7: "5/A SOY" }, "Perşembe": {}, "Cuma": { 3: "7/A SOY", 6: "6/A SOY", 7: "7/A BEDEN" } },
      "Bahar Sarı": { "Pazartesi": { 1: "6/A SO", 3: "7/A SSOS", 4: "5/A YB", 6: "6/A YB" }, "Salı": { 1: "8/A YB", 3: "7/A YB" }, "Çarşamba": { 1: "5/A YB", 4: "5/A SO", 6: "7/A YB" }, "Perşembe": { 1: "7/A REH", 2: "6/A YB", 4: "8/A YB", 5: "8/A SSOS" }, "Cuma": {} },
      "Levent Dallık": { "Pazartesi": { 1: "5/A DİNKÜ", 3: "6/A DİNKÜ", 5: "5/A SKVM", 6: "5/A REH" }, "Salı": { 1: "7/A DİNKÜ", 3: "5/A SOS", 4: "5/A SKVM", 5: "6/A SOS", 7: "8/A DİNKÜ" }, "Çarşamba": { 1: "8/A T.C.", 3: "7/A SOS", 4: "6/A SOS" }, "Perşembe": { 4: "7/A SOS", 5: "5/A SOS" }, "Cuma": {} },
      "Kadir Eser": { "Pazartesi": {}, "Salı": { 5: "8/A SSP", 6: "5/A FEN" }, "Çarşamba": { 2: "7/A FEN", 3: "8/A SSP", 4: "8/A FEN", 6: "6/A FEN" }, "Perşembe": { 3: "7/A FEN", 4: "6/A BLŞ", 6: "6/A FEN" }, "Cuma": { 1: "8/A FEN", 3: "5/A BLŞ", 4: "8/A REH", 5: "5/A FEN" } },
      "Yasemin Çakır": { "Pazartesi": {}, "Salı": { 3: "6/A SKVM", 4: "6/A MAT", 5: "5/A MAT", 6: "7/A MAT" }, "Çarşamba": { 1: "6/A SKVM", 3: "6/A MAT", 5: "7/A MAT", 6: "8/A MAT" }, "Perşembe": { 1: "6/A REH", 3: "8/A MAT", 4: "5/A MAT" }, "Cuma": { 2: "5/A MAT", 4: "6/A MAT", 5: "7/A MAT", 6: "8/A MAT" } },
      "Turan Hoca": { "Pazartesi": { 1: "7/A TR", 3: "5/A TR", 5: "6/A TR", 7: "8/A TR" }, "Salı": { 2: "5/A TR", 4: "8/A TR", 5: "7/A TR", 6: "6/A TR" }, "Çarşamba": {}, "Perşembe": { 2: "5/A TR", 6: "7/A TR" }, "Cuma": { 3: "6/A TR", 4: "8/A TR" } },
      "Demet Demirtaş": { "Pazartesi": { 1: "8/A SP", 3: "8/A MZK", 4: "8/A GR", 5: "7/A GR", 7: "7/A SP" }, "Salı": {}, "Çarşamba": {}, "Perşembe": { 2: "8/A TKTA", 4: "5/A GR" }, "Cuma": { 1: "7/A MZK", 4: "7/A TKTA", 5: "5/A MZK", 6: "6/A MZK", 7: "6/A GR" } }
    };

    const dutyDatabase = {
      "2026-09-14": { bahce: "Bahar Sarı", bina: "Levent Dallık" },
      "2026-09-15": { bahce: "Esma Baydar", bina: "Yasemin Çakır" },
      "2026-09-16": { bahce: "Kadir Eser", bina: "Levent Dallık" },
      "2026-09-17": { bahce: "Demet Taşdemir", bina: "Turan Hoca" },
      "2026-09-18": { bahce: "Esma Baydar", bina: "Yasemin Çakır" },
      "2026-09-21": { bahce: "Demet Taşdemir", bina: "Levent Dallık" },
      "2026-09-22": { bahce: "Bahar Sarı", bina: "Turan Hoca" },
      "2026-09-23": { bahce: "Kadir Eser", bina: "Esma Baydar" },
      "2026-09-24": { bahce: "Yasemin Çakır", bina: "Bahar Sarı" },
      "2026-09-25": { bahce: "Demet Taşdemir", bina: "Kadir Eser" }
    };

    function openPage(pageId) {
      document.getElementById('home-view').style.display = 'none';
      document.getElementById('teachers-view').style.display = 'none';
      document.getElementById('duty-view').style.display = 'none';

      document.getElementById(pageId).style.display = 'block';
    }

    document.getElementById('duty-date-input').value = "2026-09-14";

    function queryTeacher() {
      const teacher = document.getElementById('teacher-select').value;
      const day = document.getElementById('day-select').value;
      const hour = parseInt(document.getElementById('hour-select').value);
      const resultDiv = document.getElementById('teacher-result');

      if (teacher === "Sercan Ersöz") {
        resultDiv.innerHTML = `<div class="result-box"><h4>👔 Okul Müdürü</h4><p>Her gün idari görevdedir.</p></div>`;
        return;
      }
      if (teacher === "Esma Baydar") {
        if (hour === 7) {
          resultDiv.innerHTML = `<div class="result-box warning-box"><h4>⚠️ Dersi Yoktur!</h4><p>7. ders saatine dahil değildir.</p></div>`;
        } else {
          resultDiv.innerHTML = `<div class="result-box"><h4>🏫 Birleştirilmiş Sınıf</h4><p>Birleştirilmiş Sınıf dersindedir.</p></div>`;
        }
        return;
      }
      if (teacher === "Asude Genç") {
        if (hour === 7) {
          resultDiv.innerHTML = `<div class="result-box warning-box"><h4>⚠️ Dersi Yoktur!</h4><p>7. ders saatine dahil değildir.</p></div>`;
        } else {
          resultDiv.innerHTML = `<div class="result-box"><h4>🎨 Anasınıfı</h4><p>Anasınıfı dersindedir.</p></div>`;
        }
        return;
      }

      const teacherData = timetable[teacher];
      if (teacherData && teacherData[day] && teacherData[day][hour]) {
        const lessonCode = teacherData[day][hour];
        const parts = lessonCode.split(" ");
        const subjectFull = lessonNames[parts[1]] || parts[1];
        resultDiv.innerHTML = `<div class="result-box"><h4>📚 Ders Var: ${parts[0]}</h4><p><strong>${subjectFull} (${parts[1]})</strong> dersinde.</p></div>`;
      } else {
        if (teacher === "Ensar Çetinkaya") {
          resultDiv.innerHTML = `<div class="result-box"><h4>💼 İdari Görev</h4><p>İdari görevdedir.</p></div>`;
        } else {
          resultDiv.innerHTML = `<div class="result-box warning-box"><h4>⚠️ Dersi Yoktur!</h4><p>${teacher} için ${day} ${hour}. derste ders tanımlı değil.</p></div>`;
        }
      }
    }

    function queryDuty() {
      const dateVal = document.getElementById('duty-date-input').value;
      const resultDiv = document.getElementById('duty-result');
      const duty = dutyDatabase[dateVal];

      if (duty) {
        resultDiv.innerHTML = `
          <div class="duty-card"><div class="duty-role">🌳 BAHÇE NÖBETÇİSİ</div><div class="duty-name">${duty.bahce}</div></div>
          <div class="duty-card"><div class="duty-role">🏢 BİNA NÖBETÇİSİ</div><div class="duty-name">${duty.bina}</div></div>`;
      } else {
        resultDiv.innerHTML = `<div class="result-box warning-box"><h4>⚠️ Nöbet Kaydı Bulunamadı</h4><p>Seçilen güne ait kayıt yok veya tatil günüdür.</p></div>`;
      }
    }
  </script>
</body>
</html>
