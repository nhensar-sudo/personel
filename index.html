<!DOCTYPE html>
<html lang="tr">
<head>

  <title>Personel - Yağcıllı Ortaokulu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --accent-red: #dc2626;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 10px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 900;
      font-size: 2.6rem;
      color: var(--primary-color);
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 0.95rem;
      color: #64748b;
      margin-top: 2px;
      font-weight: 600;
    }

    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border-color);
      user-select: none;
      transition: transform 0.15s ease;
    }

    .card:active {
      transform: scale(0.98);
      background: #f1f5f9;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--primary-color);
    }

    .card-sub {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 4px;
    }

    .card-icon {
      font-size: 2rem;
      background: #eff6ff;
      padding: 10px;
      border-radius: 12px;
    }

    .view {
      display: none;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    .btn-back {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 16px;
      display: inline-block;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fff;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .result-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #eff6ff;
      border-left: 5px solid var(--secondary-color);
    }

    .warning-box {
      background: #fef2f2;
      border-left-color: var(--accent-red);
      color: #991b1b;
    }

    .duty-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
    }

    .duty-role {
      font-weight: 700;
      color: var(--primary-color);
      font-size: 0.85rem;
    }

    .duty-name {
      font-size: 1.15rem;
      font-weight: 600;
      margin-top: 4px;
    }

    .time-badge {
      display: inline-block;
      margin-top: 8px;
      background: rgba(0,0,0,0.06);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>

      </div>
    </div>

      <h2 style="font-family: 'Playfair Display', serif; font-style: italic; margin-bottom: 14px; font-size: 1.35rem;">Öğretmen Ders Konumu</h2>
      
      <div class="form-group">
        <label>Öğretmen Seçin:</label>
        <select id="teacher-select">
          <option value="Kadir Eser">Kadir Eser (Fen Bilimleri)</option>
          <option value="Yasemin Çakır">Yasemin Çakır (Matematik)</option>
          <option value="Bahar Sarı">Bahar Sarı (İngilizce)</option>
          <option value="Levent Dallık">Levent Dallık (Sosyal Bilgiler)</option>
          <option value="Esma Baydar">Esma Baydar (Sınıf Öğretmeni)</option>

          <option value="Turan Hoca">Turan Hoca (Türkçe)</option>
          <option value="Ensar Çetinkaya">Ensar Çetinkaya (Müdür Yrd.)</option>
          <option value="Sercan Ersöz">Sercan Ersöz (Okul Müdürü)</option>
          <option value="Asude Genç">Asude Genç (Okul Öncesi)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Gün Seçin:</label>

          <option value="Salı">Salı</option>
          <option value="Çarşamba">Çarşamba</option>
          <option value="Perşembe">Perşembe</option>
          <option value="Cuma">Cuma</option>
        </select>
      </div>

      <div class="form-group">
        <label>Ders Saati Seçin:</label>

          <option value="1">1. Ders Saati (09.00 - 09.40)</option>
          <option value="2">2. Ders Saati (09.50 - 10.30)</option>
          <option value="3">3. Ders Saati (10.40 - 11.20)</option>
          <option value="4">4. Ders Saati (11.30 - 12.10)</option>

          <option value="6">6. Ders Saati (13.50 - 14.30)</option>
          <option value="7">7. Ders Saati (14.40 - 15.20)</option>
        </select>
      </div>

      <button class="btn-submit" onclick="queryTeacher()">Sorgula</button>
      <div id="teacher-result"></div>
    </div>

      document.getElementById('home-view').style.display = 'none';
      document.getElementById('teachers-view').style.display = 'none';
      document.getElementById('duty-view').style.display = 'none';

      document.getElementById(pageId).style.display = 'block';
    }

    document.getElementById('duty-date-input').value = "2026-09-14";

    function queryTeacher() {
      const teacher = document.getElementById('teacher-select').value;
      const day = document.getElementById('day-select').value;
      const hour = parseInt(document.getElementById('hour-select').value);
      const resultDiv = document.getElementById('teacher-result');

      const timeSlot = day === "Cuma" ? timeTableSlots.cuma[hour] : timeTableSlots.normal[hour];
      const breakInfo = day === "Cuma" ? timeTableSlots.cuma.break : timeTableSlots.normal.break;

      // 1. Okul Müdürü
      if (teacher === "Sercan Ersöz") {
        resultDiv.innerHTML = `
          <div class="result-box">
            <h4>👔 Sercan Ersöz (Okul Müdürü)</h4>
            <p style="margin-top:6px;">Haftaiçi her gün idari görevdedir.</p>
            <div class="time-badge">${timeSlot}</div>
          </div>`;
        return;
      }

      // 2. Esma Baydar (Sınıf Öğretmeni)
      if (teacher === "Esma Baydar") {
        if (hour === 7) {
          resultDiv.innerHTML = `
            <div class="result-box warning-box">
              <h4>⚠️ Dersi Yoktur!</h4>
              <p style="margin-top:6px;">İlkokul öğretmeni olduğu için 7. ders saatine dahil değildir.</p>
              <div class="time-badge">${timeSlot}</div>
            </div>`;
        } else {
          resultDiv.innerHTML = `
            <div class="result-box">
              <h4>🏫 Esma Baydar</h4>
              <p style="margin-top:6px;">Şu anda <strong>Birleştirilmiş Sınıf</strong> dersindedir.</p>
              <div class="time-badge">${hour}. Ders (${timeSlot})</div>
              <div style="font-size:0.75rem; color:#64748b; margin-top:4px;">Not: Öğle Arası: ${breakInfo}</div>
            </div>`;
        }
        return;
      }

      // 3. Asude Genç (Okul Öncesi Öğretmeni)
      if (teacher === "Asude Genç") {
        if (hour === 7) {
          resultDiv.innerHTML = `
            <div class="result-box warning-box">
              <h4>⚠️ Dersi Yoktur!</h4>
              <p style="margin-top:6px;">Anasınıfı öğretmeni olduğu için 7. ders saatine dahil değildir.</p>
              <div class="time-badge">${timeSlot}</div>
            </div>`;
        } else {
          resultDiv.innerHTML = `
            <div class="result-box">
              <h4>🎨 Asude Genç</h4>
              <p style="margin-top:6px;">Şu anda <strong>Anasınıfı</strong> şubesindedir.</p>
              <div class="time-badge">${hour}. Ders (${timeSlot})</div>
              <div style="font-size:0.75rem; color:#64748b; margin-top:4px;">Not: Öğle Arası: ${breakInfo}</div>
            </div>`;
        }
        return;
      }

      // 4. Branş Öğretmenleri & Müdür Yardımcısı
      const teacherSchedule = timetable[teacher];
      if (teacherSchedule && teacherSchedule[day] && teacherSchedule[day][hour]) {
        const item = teacherSchedule[day][hour];
        const [cls, subCode] = item.split(" ");
        const subName = lessonNames[subCode] || subCode;

        resultDiv.innerHTML = `
          <div class="result-box">
            <h4>📚 ${teacher}</h4>
            <p style="margin-top:6px;">Şu anda <strong>${cls}</strong> sınıfında <strong>${subName} (${subCode})</strong> dersindedir.</p>
            <div class="time-badge">${hour}. Ders (${timeSlot})</div>
            <div style="font-size:0.75rem; color:#64748b; margin-top:4px;">Not: Öğle Arası: ${breakInfo}</div>
          </div>`;
      } else {
        if (teacher === "Ensar Çetinkaya") {
          resultDiv.innerHTML = `
            <div class="result-box">
              <h4>💼 Ensar Çetinkaya (Müdür Yrd.)</h4>
              <p style="margin-top:6px;">Bu saatte ders yükümlülüğü bulunmadığı için <strong>İdari Görev</strong> yapmaktadır.</p>
              <div class="time-badge">${timeSlot}</div>
            </div>`;
        } else {
          resultDiv.innerHTML = `
            <div class="result-box warning-box">
              <h4>⚠️ Dersi Yoktur!</h4>
              <p style="margin-top:6px;"><strong>${teacher}</strong> için ${day} günü ${hour}. derste ders tanımlı değildir (Boş gün veya boş saat).</p>
              <div class="time-badge">${timeSlot}</div>
            </div>`;
        }
      }
    }

    function queryDuty() {
      const dateVal = document.getElementById('duty-date-input').value;
      const resultDiv = document.getElementById('duty-result');
      const duty = dutyDatabase[dateVal];

      if (duty) {
        resultDiv.innerHTML = `
          <div class="duty-card">
            <div class="duty-role">🌳 BAHÇE NÖBETÇİSİ</div>
            <div class="duty-name">${duty.bahce}</div>
          </div>
          <div class="duty-card">
            <div class="duty-role">🏢 BİNA NÖBETÇİSİ</div>
            <div class="duty-name">${duty.bina}</div>
          </div>`;
      } else {
        resultDiv.innerHTML = `
          <div class="result-box warning-box">
            <h4>⚠️ Nöbet Kaydı Bulunamadı</h4>
            <p style="margin-top:6px;">Seçilen tarihe ait (${dateVal}) nöbet görevi bulunmamaktadır (Hafta sonu veya tatil olabilir).</p>
          </div>`;
      }
    }
  </script>
</body>
</html>
